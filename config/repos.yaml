    它代码直观、调试方便，研究社区和开源模型采用广泛；当现成 AI 工具不够用时，它让开发者能够训练或修改模型本身。
  use_cases:
    - 从头训练神经网络或微调已有模型
    - 实现论文中的新模型、损失函数和训练方法
    - 构建需要 GPU 加速的视觉、语音或自然语言任务
