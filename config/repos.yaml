- full_name: vllm-project/vllm
  display_name: vLLM
  category: 推理引擎
  reason: 高吞吐大模型推理与服务
  what_it_is: >-
    一个面向大语言模型的高吞吐推理和服务引擎，可把开源模型封装成供应用调用的接口。
  why_use_it: >-
    当多个用户同时调用模型时，推理速度、显存利用率和并发能力会直接影响成本与体验；vLLM 专门解决这类服务端问题。
  use_cases:
    - 搭建兼容常见调用方式的大模型 API 服务
    - 为聊天机器人、智能体和 RAG 应用提供共享推理后端
    - 进行批量生成、并发测试和模型服务性能评估
