- full_name: huggingface/transformers
  display_name: Transformers
  category: 模型框架
  reason: 主流多模态模型定义与推理生态
  what_it_is: >-
    一个统一使用文本、图像、音频和多模态预训练模型的 Python 工具库，覆盖模型加载、训练与推理。
  why_use_it: >-
    它把不同模型的接口尽量统一，并连接 Hugging Face 模型生态，适合不想从论文和底层代码重新实现模型的应用开发者。
  use_cases:
    - 加载开源大模型制作聊天、分类、翻译或信息抽取应用
    - 用自己的数据微调文本、视觉或多模态模型
    - 快速比较不同模型，并把模型接入现有 Python 服务
