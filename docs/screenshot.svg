        <text x="24" y="66" fill="#f2f7ec" font-size="25" font-weight="750">vLLM</text>
        <text x="24" y="91" fill="#99aaa3" font-size="14">vllm-project/vllm</text>
        <rect x="24" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="36" y="135" fill="#f2f7ec" font-size="15">68.1k Stars</text>
        <rect x="153" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="165" y="135" fill="#f2f7ec" font-size="15">+864 / 7日</text>
        <rect x="282" y="112" width="116" height="37" rx="9" fill="#d7ff55"/>
        <text x="294" y="135" fill="#0b140f" font-size="15" font-weight="750">趋势分 88.0</text>
      </g>
      <g transform="translate(960)">
        <rect width="455" height="165" rx="18" fill="#0d1c19" stroke="#29413a"/>
        <text x="24" y="30" fill="#d7ff55" font-size="12" font-weight="800">智能体框架</text>
        <text x="24" y="66" fill="#f2f7ec" font-size="25" font-weight="750">browser-use</text>
        <text x="24" y="91" fill="#99aaa3" font-size="14">browser-use/browser-use</text>
        <rect x="24" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="36" y="135" fill="#f2f7ec" font-size="15">72.4k Stars</text>
        <rect x="153" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="165" y="135" fill="#f2f7ec" font-size="15">+592 / 7日</text>
        <rect x="282" y="112" width="116" height="37" rx="9" fill="#d7ff55"/>
        <text x="294" y="135" fill="#0b140f" font-size="15" font-weight="750">趋势分 81.7</text>
