        <rect x="24" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="36" y="135" fill="#f2f7ec" font-size="15">166.6k Stars</text>
        <rect x="153" y="112" width="116" height="37" rx="9" fill="#152823"/>
        <text x="165" y="135" fill="#f2f7ec" font-size="15">+1.2k / 7日</text>
        <rect x="282" y="112" width="116" height="37" rx="9" fill="#d7ff55"/>
        <text x="294" y="135" fill="#0b140f" font-size="15" font-weight="750">趋势分 92.4</text>
      </g>
