<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenScope AI 界面示意图</title>
  <desc id="desc">深绿色背景的开源项目趋势观察站，包含标题、统计指标和六张项目卡片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.65" stop-color="#0a1815"/>
      <stop offset="1" stop-color="#173626"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="17%" r="40%">
      <stop offset="0" stop-color="#d7ff55" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d7ff55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="50" width="46" height="46" rx="12" fill="#d7ff55"/>
    <text x="93" y="80" fill="#0b140f" font-size="15" font-weight="800" text-anchor="middle">OS</text>
    <text x="132" y="81" fill="#f2f7ec" font-size="23" font-weight="750">OpenScope AI</text>
    <rect x="1352" y="52" width="178" height="42" rx="21" fill="none" stroke="#456058"/>
    <text x="1441" y="79" fill="#a9bbb4" font-size="15" text-anchor="middle">GitHub 数据源</text>

    <text x="70" y="180" fill="#d7ff55" font-size="14" font-weight="800" letter-spacing="3">OPEN SOURCE SIGNALS · DAILY</text>
    <text x="70" y="265" fill="#f2f7ec" font-size="78" font-weight="760" letter-spacing="-4">看见 AI 开源生态</text>
    <text x="70" y="344" fill="#d7ff55" font-size="78" font-weight="760" letter-spacing="-4">真正发生的变化</text>
    <text x="73" y="395" fill="#99aaa3" font-size="21">每天追踪模型框架、推理引擎、智能体与 AI 应用。</text>

    <g transform="translate(70 440)">
      <rect width="760" height="100" rx="18" fill="#0c201b" stroke="#29413a"/>
      <line x1="190" y1="0" x2="190" y2="100" stroke="#29413a"/>
      <line x1="380" y1="0" x2="380" y2="100" stroke="#29413a"/>
      <line x1="570" y1="0" x2="570" y2="100" stroke="#29413a"/>
      <g fill="#f2f7ec" font-size="28" font-weight="750">
        <text x="25" y="48">15</text><text x="215" y="48">30</text><text x="405" y="48">0</text><text x="595" y="48">2026-09-24</text>
      </g>
      <g fill="#99aaa3" font-size="13">
        <text x="25" y="74">追踪项目</text><text x="215" y="74">历史天数</text><text x="405" y="74">过期回退</text><text x="595" y="74">数据日期</text>
      </g>
    </g>

    <text x="70" y="610" fill="#d7ff55" font-size="13" font-weight="800" letter-spacing="3">TREND BOARD</text>
    <text x="70" y="654" fill="#f2f7ec" font-size="42" font-weight="750">趋势观察</text>

    <g transform="translate(70 685)">
      <g>
